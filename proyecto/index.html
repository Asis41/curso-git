<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página de equipo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px;
      line-height: 1.6;
      color: #1f2328;
      background: #ffffff;
    }

    header {
      border-bottom: 2px solid #d0d7de;
      margin-bottom: 24px;
    }

    h1 {
      color: #0969da;
    }

    .lema {
      color: #57606a;
      font-style: italic;
    }

    footer {
      border-top: 1px solid #d0d7de;
      margin-top: 40px;
      font-size: 0.9em;
      color: #57606a;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mi página de equipo</h1>
    <p class="lema">Aprendiendo Git, un commit a la vez.</p>
  </header>

  <main>
    <section id="sobre-mi">
      <h2>Sobre mí</h2>
      <p>Hola, soy [tu nombre] y estoy aprendiendo control de versiones.</p>
    </section>

    <section id="herramientas">
      <h2>Herramientas que uso</h2>
      <ul>
        <li>Git</li>
        <li>GitHub</li>
        <li>Un editor de código</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>Hecho durante el curso de Git.</p>
  </footer>
</body>
</html>
